shell /usr/bin/zsh
include ./theme.conf
# 设置左右边距
window_padding_width 0
# 隐藏标题栏
hide_window_decorations no
# 背景透明度
background_opacity 0.8
# 字体
font_family JetBrainsMono
# 字体大小
font_size 14
# 不要记住窗口大小（yes no）
remember_window_size no
# 关闭窗口时不要询问是否关闭
confirm_os_window_close 0


#key binds
map ctrl+enter toggle_fullscreen

# ════════════════════════════════════════════════════════════════════
#  mako 通知主题 · 由 matugen 根据壁纸配色生成
#  模板：~/.config/matugen/templates/mako.conf     请勿直接修改本文件
# ════════════════════════════════════════════════════════════════════

font=JetBrainsMono Nerd Font Propo 10
background-color={{colors.surface_container_high.default.hex}}F2
text-color={{colors.on_surface.default.hex}}
border-size=2
border-color={{colors.primary.default.hex}}80
border-radius=14
padding=14,16
margin=10
outer-margin=16
width=380
height=240
max-visible=5
anchor=top-right
layer=overlay
default-timeout=8000
icons=1
max-icon-size=36
icon-border-radius=9
icon-location=left
markup=1
actions=1
progress-color=over {{colors.primary.default.hex}}
group-by=app-name
format=<b>%s</b>\n<span size="small" alpha="45875">%a</span>\n\n%b

[urgency=low]
border-color={{colors.outline_variant.default.hex}}
default-timeout=5000

[urgency=critical]
background-color={{colors.error_container.default.hex}}F2
text-color={{colors.on_error_container.default.hex}}
border-color={{colors.error.default.hex}}
default-timeout=0
